name: OpenBudget monitoring

# DIQQAT: cron o'chirilgan.
#
# new.openbudget.uz O'zbekistondan tashqaridagi IP larga javob bermaydi
# (18 ta chet el tugunidan tekshirildi — 17 tasi "connection timed out",
# bittasi javobsiz). GitHub runnerlari AQSh/Yevropada, shuning uchun bu
# workflow saytga ulana olmaydi.
#
# Ish faqat O'zbekiston ichidagi mashinada bajarilishi kerak:
# uy kompyuteri (Windows Task Scheduler), UZ VPS yoki self-hosted runner.
# Batafsil: README > "Qayerda ishlatish mumkin".
on:
  workflow_dispatch:        # faqat qo'lda — sinov uchun

# Bir vaqtda bitta ishlasin — baza keshiga ikki tomondan yozilmasin
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      # Oldingi ishga tushishdagi bazani tiklaymiz — deltalar shu orqali
      # hisoblanadi. Birinchi safar kesh bo'sh bo'ladi, bu normal.
      - name: Bazani keshdan tiklash
        uses: actions/cache/restore@v4
        with:
          path: history.db
          key: history-db-${{ github.run_id }}
          restore-keys: history-db-

      - name: Tekshirish va yuborish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROJECT_ID: ${{ vars.PROJECT_ID || '055530954008' }}
          TZ: Asia/Tashkent
        run: python bot.py --once

      - name: Bazani keshga saqlash
        if: always()
        uses: actions/cache/save@v4
        with:
          path: history.db
          key: history-db-${{ github.run_id }}

      # Xato bo'lsa sababini Telegramga yuboradi — Actions logini ochmasdan
      # nima bo'lganini bilish uchun.
      - name: Xatolikni aniqlash va yuborish
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "--- bot.log ---"
          cat bot.log 2>/dev/null || echo "(bot.log yo'q)"

          echo "--- saytga ulanish tekshiruvi ---"
          NET=$(curl -sS -m 25 -o /dev/null \
            -w "HTTP %{http_code} / %{time_total}s" \
            "https://new.openbudget.uz/api/v2/info/board/55?stage=PASSED&page=0&size=5&regionId=8&districtId=93" \
            2>&1 || echo "ULANIB BO'LMADI")
          echo "$NET"

          IP=$(curl -sS -m 10 https://api.ipify.org 2>/dev/null || echo "?")
          GEO=$(curl -sS -m 10 "https://ipapi.co/$IP/country_name/" 2>/dev/null || echo "?")

          TEXT="GitHub Actions xatosi

          Sayt: $NET
          Runner IP: $IP ($GEO)

          Log:
          $(tail -c 600 bot.log 2>/dev/null || echo '(log yo_q)')"

          curl -sS -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$TEXT" > /dev/null
          echo "Xato haqida Telegramga yuborildi"
